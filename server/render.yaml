services:
  - type: web
    name: interfone-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:sio_app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_EMAIL
        sync: false
